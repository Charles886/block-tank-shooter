<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>方塊射擊</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- 商店按鈕 -->
        <button class="shop-toggle-btn" id="shopToggleBtn" title="開啟商店 (B)">🛒</button>
        
        <div class="hud" id="hud">
            <div class="hud-item"><span class="hud-label">分數</span><span class="hud-value" id="score">0</span></div>
            <div class="hud-item"><span class="hud-label">金幣</span><span class="hud-value" id="goldCount" style="color:#ffd700">0</span></div>
            <div class="hud-item"><span class="hud-label">生命</span><span class="hud-value" id="health">100</span><span class="hud-value" id="maxHealth" style="font-size:14px;color:#888">/100</span></div>
            <div class="hud-item"><span class="hud-label">波次</span><span class="hud-value" id="wave">1</span></div>
            <div class="hud-item"><span class="hud-label">道具</span><span class="hud-value" id="powerups">-</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <!-- 商店面板 -->
        <div class="shop-panel hidden" id="shopPanel">
            <div class="shop-header">
                <h3>🛒 商店</h3>
                <span class="shop-gold">💰 <span id="shopGold">0</span></span>
                <button class="shop-close-btn" id="shopCloseBtn">✕</button>
            </div>
            <div class="shop-items">
                <div class="shop-item" data-item="health" onclick="Shop.buy('health')">
                    <div class="shop-item-icon">❤️</div>
                    <div class="shop-item-info">
                        <div class="shop-item-name">最大生命 +25</div>
                        <div class="shop-item-desc">永久增加最大生命值</div>
                    </div>
                    <div class="shop-item-cost">💰 50</div>
                </div>
                <div class="shop-item" data-item="damage" onclick="Shop.buy('damage')">
                    <div class="shop-item-icon">⚔️</div>
                    <div class="shop-item-info">
                        <div class="shop-item-name">傷害 +1</div>
                        <div class="shop-item-desc">永久增加子彈傷害</div>
                    </div>
                    <div class="shop-item-cost">💰 75</div>
                </div>
                <div class="shop-item" data-item="speed" onclick="Shop.buy('speed')">
                    <div class="shop-item-icon">⚡</div>
                    <div class="shop-item-info">
                        <div class="shop-item-name">移動速度 +10%</div>
                        <div class="shop-item-desc">永久增加移動速度</div>
                    </div>
                    <div class="shop-item-cost">💰 40</div>
                </div>
                <div class="shop-item" data-item="firerate" onclick="Shop.buy('firerate')">
                    <div class="shop-item-icon">🔥</div>
                    <div class="shop-item-info">
                        <div class="shop-item-name">射速 +15%</div>
                        <div class="shop-item-desc">永久減少射擊間隔</div>
                    </div>
                    <div class="shop-item-cost">💰 100</div>
                </div>
            </div>
            <div class="shop-footer">
                <p class="shop-hint">按 B 鍵開啟/關閉商店</p>
            </div>
        </div>

        <!-- 開始畫面 -->
        <div class="overlay" id="overlay">
            <div class="overlay-content">
                <h1>方塊射擊</h1>
                <div class="instructions">
                    <p><strong>W A S D</strong> — 移動</p>
                    <p><strong>滑鼠 / 觸控</strong> — 瞄準</p>
                    <p><strong>按住左鍵 / Enter / 觸控</strong> — 射擊</p>
                    <p><strong>空白鍵</strong> — 暫停</p>
                    <p>撿取掉落道具：<span style="color:#06d6a0">治療</span> <span style="color:#118ab2">快速射擊</span> <span style="color:#ef476f">三倍子彈</span></p>
                </div>
                <div class="leaderboard">
                    <h2>排行榜</h2>
                    <div id="lbStart"></div>
                </div>
                <button class="btn btn-primary" id="startBtn">開始遊戲</button>
            </div>
        </div>

        <!-- 暫停畫面 -->
        <div class="overlay hidden" id="pauseOverlay">
            <div class="overlay-content">
                <h1>暫停中</h1>
                <p>按空白鍵繼續</p>
            </div>
        </div>

        <!-- 結束畫面 -->
        <div class="overlay hidden" id="gameOverScreen">
            <div class="overlay-content">
                <h1>遊戲結束</h1>
                <div class="final-score">最終分數: <span id="finalScore">0</span></div>
            <p id="waveReached" style="color:#888; margin-bottom: 10px;"></p>
            <div class="leaderboard">
                <h2>排行榜</h2>
                <div id="lbEnd"></div>
            </div>
                <button class="btn btn-restart" id="restartBtn">重新開始</button>
            </div>
        </div>
    </div>

    <script src="sound.js"></script>
    <script src="entities.js"></script>
    <script src="powerups.js"></script>
    <script src="leaderboard.js"></script>
    <script src="shop.js"></script>
    <script src="core.js"></script>
</body>
</html>
